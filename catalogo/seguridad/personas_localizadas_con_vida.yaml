id: personas_localizadas_con_vida
nombre: Personas localizadas con vida
tema: seguridad
definicion: >
  Personas localizadas con vida en el municipio durante el mes.
unidad: personas
fuente: Registro Estatal de Personas Desaparecidas (REPD), Fiscalía del Estado de Jalisco
pipeline: repd
origen: personas_localizadas
nivel: municipal
periodicidad: mensual
cobertura:
  geografica: Municipios de Jalisco
  temporal: "por confirmar contra la base"
notas: |
  El municipio es el de desaparición, no el de residencia. Las tasas usan como denominador la
  población de CONAPO del año correspondiente.
parametros:
  - nombre: cve_geo
    tipo: str
    requerido: false
    descripcion: Clave INEGI de 5 dígitos del municipio (ej. 14039). Omitir para todos los municipios.
  - nombre: anio_min
    tipo: int
    requerido: false
    descripcion: Primer año de la serie, inclusive. Omitir para empezar en el primero disponible.
  - nombre: anio_max
    tipo: int
    requerido: false
    descripcion: Último año de la serie, inclusive. Omitir para llegar al último disponible.
sql: |
  SELECT
      LPAD(clave_municipio::text, 5, '0')          AS cve_geo,
      nombre::text                                 AS nombre_geo,
      to_char(fecha, 'YYYY-MM')                    AS periodo,
      con_vida::numeric                            AS valor,
      NULL::text                                   AS categoria
  FROM personas_localizadas
  WHERE (CAST(:cve_geo AS text) IS NULL
         OR LPAD(clave_municipio::text, 5, '0') = CAST(:cve_geo AS text))
    AND (CAST(:anio_min AS integer) IS NULL
         OR EXTRACT(YEAR FROM fecha) >= CAST(:anio_min AS integer))
    AND (CAST(:anio_max AS integer) IS NULL
         OR EXTRACT(YEAR FROM fecha) <= CAST(:anio_max AS integer))
  ORDER BY cve_geo, periodo
