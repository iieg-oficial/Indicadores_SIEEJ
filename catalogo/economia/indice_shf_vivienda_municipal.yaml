id: indice_shf_vivienda_municipal
nombre: Índice SHF de precios de la vivienda, municipal
tema: economia
definicion: >
  Índice SHF de precios de la vivienda por municipio.
unidad: índice
fuente: SHF - Índice SHF de precios de la vivienda en México
pipeline: indice_shf_vivienda
origen: vw_indice_shf_vivienda_municipal
nivel: municipal
periodicidad: trimestral
cobertura:
  geografica: Municipios que pública SHF
  temporal: "por confirmar contra la base"
notas: |
  SHF solo pública los municipios con mercado hipotecario suficiente, no los 125 de Jalisco.
parametros:
  - nombre: cve_geo
    tipo: str
    requerido: false
    descripcion: Clave INEGI de 5 dígitos del municipio (ej. 14039). Omitir para todos los municipios.
  - nombre: anio_min
    tipo: int
    requerido: false
    descripcion: Primer año de la serie, inclusive. Omitir para empezar en el primero disponible.
  - nombre: anio_max
    tipo: int
    requerido: false
    descripcion: Último año de la serie, inclusive. Omitir para llegar al último disponible.
sql: |
  SELECT
      LPAD(municipio_id::text, 5, '0')             AS cve_geo,
      nomgeo::text                                 AS nombre_geo,
      anio::text || '-Q' || trimestre::text        AS periodo,
      indice::numeric                              AS valor,
      NULL::text                                   AS categoria
  FROM vw_indice_shf_vivienda_municipal
  WHERE (CAST(:cve_geo AS text) IS NULL
         OR LPAD(municipio_id::text, 5, '0') = CAST(:cve_geo AS text))
    AND (CAST(:anio_min AS integer) IS NULL
         OR anio >= CAST(:anio_min AS integer))
    AND (CAST(:anio_max AS integer) IS NULL
         OR anio <= CAST(:anio_max AS integer))
  ORDER BY cve_geo, periodo
