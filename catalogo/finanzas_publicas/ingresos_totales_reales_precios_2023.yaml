id: ingresos_totales_reales_precios_2023
nombre: Ingresos municipales totales reales
tema: finanzas_publicas
definicion: >
  Ingresos municipales totales deflactados con el INPC a precios constantes de 2023.
unidad: pesos constantes de 2023
fuente: INEGI - Estadística de Finanzas Públicas Estatales y Municipales (EFIPEM)
pipeline: efipem
origen: ingresos_totales_reales_precios_2023
nivel: municipal
periodicidad: anual
cobertura:
  geografica: Municipios de Jalisco
  temporal: "1990-2024"
notas: |
  La vista es un grid completo municipio x año: los municipios sin dato reportado ese año
  aparecen con valor nulo, no ausentes.
parametros:
  - nombre: cve_geo
    tipo: str
    requerido: false
    descripcion: Clave INEGI de 5 dígitos del municipio (ej. 14039). Omitir para todos los municipios.
  - nombre: anio_min
    tipo: int
    requerido: false
    descripcion: Primer año de la serie, inclusive. Omitir para empezar en el primero disponible.
  - nombre: anio_max
    tipo: int
    requerido: false
    descripcion: Último año de la serie, inclusive. Omitir para llegar al último disponible.
sql: |
  SELECT
      LPAD(clave_municipio::text, 5, '0')          AS cve_geo,
      nombre::text                                 AS nombre_geo,
      to_char(fecha, 'YYYY')                       AS periodo,
      valor::numeric                               AS valor,
      NULL::text                                   AS categoria
  FROM ingresos_totales_reales_precios_2023
  WHERE (CAST(:cve_geo AS text) IS NULL
         OR LPAD(clave_municipio::text, 5, '0') = CAST(:cve_geo AS text))
    AND (CAST(:anio_min AS integer) IS NULL
         OR EXTRACT(YEAR FROM fecha) >= CAST(:anio_min AS integer))
    AND (CAST(:anio_max AS integer) IS NULL
         OR EXTRACT(YEAR FROM fecha) <= CAST(:anio_max AS integer))
  ORDER BY cve_geo, periodo
