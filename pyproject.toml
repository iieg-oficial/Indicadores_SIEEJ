[project]
name = "indicadores-sieej"
version = "0.1"
description = "Banco de indicadores del IIEG expuesto como servidor MCP y API REST."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "PyYAML>=6",
    # Mismas que ETL-SIEEJ: los dos repositorios leen las mismas bases y no hay
    # razón para divergir en la capa de datos. El driver decide cómo se escribe el
    # DSN: con psycopg2 el prefijo `postgresql://` de docs/conexiones.md resuelve solo.
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "integration: pruebas que requieren una base PostgreSQL viva",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "F401", # imports sin usar
    "F811", # redefinición sin usar
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["indicadores_sieej"]
