[project]
name = "indicadores-sieej"
version = "0.1"
description = "Banco de indicadores del IIEG expuesto como servidor MCP y API REST."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "PyYAML>=6",
    # Mismas que ETL-SIEEJ: los dos repositorios leen las mismas bases y no hay
    # razón para divergir en la capa de datos. El driver decide cómo se escribe el
    # DSN: con psycopg2 el prefijo `postgresql://` de docs/conexiones.md resuelve solo.
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    # Las dos superficies. FastMCP trae su propio stack ASGI, así que starlette no
    # se declara aparte; el servidor que lo corre lo pone el despliegue.
    "fastmcp>=3",
    "fastapi>=0.115",
]

[project.optional-dependencies]
# httpx lo necesita el TestClient de FastAPI; llega transitivamente, pero las
# pruebas lo importan de frente. uvicorn es para levantarlo en local: en producción
# lo fija la imagen.
dev = ["pytest", "pytest-asyncio", "httpx", "uvicorn", "ruff", "pre-commit"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
# Las tools MCP se prueban con el cliente asíncrono de FastMCP; en modo auto no hace
# falta marcar cada prueba.
asyncio_mode = "auto"
markers = [
    "integration: pruebas que requieren una base PostgreSQL viva",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "F401", # imports sin usar
    "F811", # redefinición sin usar
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["indicadores_sieej"]
