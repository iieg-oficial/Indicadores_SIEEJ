# Catálogo de labels del repositorio.
#
# Deliberadamente son pocas. El título de cada issue es un conventional commit
# —`feat(motor):`, `test(catalogo):`, `spike(auth):`— así que el tipo y el área
# ya viajan ahí, y el milestone lleva la fase. Etiquetar eso otra vez solo
# obliga a mantener sincronizadas dos fuentes que dicen lo mismo.
#
# Aquí queda únicamente lo que no se deduce del título ni del milestone.

- name: "decision"
  color: "fef2c0"
  description: "Decisión abierta que debe cerrar alguien fuera del equipo"

- name: "bloqueante"
  color: "e11d21"
  description: "Bloquea el avance del resto del backlog"

- name: "repo: etl"
  color: "000000"
  description: "El trabajo se realiza en el repositorio ETL-SIEEJ"
