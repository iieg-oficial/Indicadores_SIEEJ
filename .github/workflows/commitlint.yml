name: Commitlint

on:
  pull_request:
    branches:
      - main

jobs:
  commitlint:
    name: Convención de commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validar los commits del PR
        run: |
          TYPES="feat|fix|update|refactor|chore|docs|test|ci|perf|style|build"
          PATTERN="^($TYPES)(\([a-z0-9_-]+\))?: .+"
          fallidos=0
          while read -r sha; do
            msg=$(git log -1 --format=%s "$sha")
            case "$msg" in
              Merge*) continue ;;
            esac
            if ! echo "$msg" | grep -qE "$PATTERN"; then
              echo "::error::Commit $sha no sigue la convención: $msg"
              fallidos=1
            fi
          done < <(git rev-list origin/${{ github.base_ref }}..HEAD)
          exit $fallidos
