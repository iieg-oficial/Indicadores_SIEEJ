name: CI

# Solo en PR: disparar también en push duplica cada job y gasta el doble de minutos.
on:
  pull_request:
    branches:
      - main
  workflow_call:

jobs:
  lint:
    name: Linter y formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  pruebas:
    name: Pruebas sin base de datos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Las pruebas de integración requieren bases reales y no corren aquí.
      - run: pytest -m "not integration"

  # Falta el job "catalogo", que corre `python -m indicadores_sieej.cli validar`
  # como gate de todo PR que toque catalogo/. Se agrega en #10, cuando el CLI
  # exista (#11) y haya catálogo que validar (#3).
