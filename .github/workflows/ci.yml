name: CI

# Solo en PR: disparar también en push duplica cada job y gasta el doble de minutos.
# Sin filtro de rama base a propósito: `branches:` filtra por la rama **destino**, así
# que con él un PR apilado sobre otro PR nunca dispara el CI, y el stack merge lo bloquea
# por falta del check requerido. Todo PR corre las pruebas, apunte a donde apunte.
on:
  pull_request:

# Un push nuevo cancela el run anterior del mismo PR, en vez de pagar los dos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    # El formato y la convención de commits no corren aquí: los cubren los hooks
    # locales (.pre-commit-config.yaml y .githooks/commit-msg). Un job en vez de
    # tres, porque GitHub factura cada uno redondeado al minuto.
    name: Pruebas sin base de datos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Las pruebas de integración requieren bases reales y no corren aquí.
      - run: pytest -m "not integration"
      # Gate de todo PR que toque catalogo/: corre las siete validaciones y sale
      # con código distinto de cero nombrando el archivo que falla.
      - run: python -m indicadores_sieej.cli validar
