name: Publicar release

# Crea el tag y el release cuando se mergea un PR de "Preparar release".
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publicar:
    if: "startsWith(github.event.head_commit.message, 'chore(release): v')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Leer la versión y el animal del commit
        id: datos
        # El mensaje del commit viaja por env, no interpolado en el script: un ${{ }}
        # dentro de `run` deja que el texto del commit se ejecute como shell.
        env:
          MENSAJE: ${{ github.event.head_commit.message }}
        run: |
          titulo=$(echo "$MENSAJE" | head -1)
          version=$(echo "$titulo" | sed -E 's/^chore\(release\): v([0-9.]+) .*/\1/')
          animal=$(echo "$titulo" | sed -E 's/^chore\(release\): v[0-9.]+ (.*)$/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "animal=$animal"   >> "$GITHUB_OUTPUT"

      - name: Crear el tag y el release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.datos.outputs.version }}
          ANIMAL: ${{ steps.datos.outputs.animal }}
        run: |
          v="v$VERSION"
          git tag "$v"
          git push origin "$v"
          # La entrada más reciente del CHANGELOG es la de esta versión.
          notas=$(awk '/^## /{n++} n==1' CHANGELOG.md)
          gh release create "$v" --title "$v $ANIMAL" --notes "$notas"
