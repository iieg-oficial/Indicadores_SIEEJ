# Alembic para el registro de API keys. Solo esta base: las 33 del ETL las migra
# ETL-SIEEJ con Flyway, y este servicio nunca les escribe.
#
# Aquí NO va `sqlalchemy.url`: este archivo se versiona y un DSN lleva credenciales.
# Lo inyecta `registry.alembic_config()` desde IIEGDB_REGISTRY_DSN, así que servidor y
# migraciones leen la misma variable.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
